# Nav2 params for Gurdy (Phase 3). Based on nav2_bringup's nav2_params.yaml (Jazzy), changed for a slow
# holonomic-ish hexapod:
#  - MPPI, Omni motion model (vx 0.15, vy 0.10, wz 0.60 = robot.yaml command_limits); accel limits match
#    the gait node (0.5 m/s2, 2 rad/s2). Footprint + limits are re-patched from robot.yaml at launch
#    (gurdy_navigation.footprint.patch_nav2_params), the values here are the committed defaults.
#  - minimum speeds 0.09 m/s / 0.23 rad/s are enforced by cmd_vel_min_speed_node (smoother -> node -> collision_monitor):
#    small commands are LIFTED to the minimum (zeroing deadlocked the start: MPPI's first step from rest is 0.04 m/s),
#    so the terrain_v1 policy's from-rest dead zone (|v| ~0.03 m/s) is never commanded (rl_command deadband 0.015 / 0.05)
#  - goal tolerance xy 0.12 m / yaw 0.2 rad so that the minimum speed cannot make the robot oscillate around the goal
#  - lidar /scan (frame lidar_link, 0.05 m above base_link): collision_monitor heights are relative to base_link
#  - AMCL (localization mode) uses the Omni motion model; initial pose = spawn origin
#  - lidar /scan is /scan_raw minus the robot's own legs (scan_self_filter_node: returns inside the footprint -> inf). Raw scans had
#    self-hits at 0.15-0.29 m while walking, which made collision_monitor FootprintApproach throttle /cmd_vel to ~5 % (docs/results/phase3_selfhit.md)
#  - Nav2 output: velocity_smoother -> cmd_vel_min_speed_node -> collision_monitor -> /cmd_vel (gait node or policy node subscribes there)
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.2
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 1000
    min_particles: 300
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::OmniMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # Phase 8a (docs/results/phase8a_nav2_doorways.md): was 20 ms (Nav2 default). Every Nav2 abort in lab4 v3 / postfix_7d (5) and the final eval (6) was
    # 'Timed out while waiting for action server to acknowledge goal request' for follow_path / compute_path_to_pose during the 1 Hz replanning under CPU load;
    # such a failure carries no error code, so the BT's recovery subtree refuses to run and the goal aborts at once ('path blocked').
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    error_code_names: [compute_path_error_code, follow_path_error_code]
controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.15, movement_time_allowance: 20.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.12, yaw_goal_tolerance: 0.2}
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.1
      batch_size: 1000
      ax_max: 0.4
      ax_min: -0.4
      ay_max: 0.3
      ay_min: -0.3
      az_max: 1.5
      vx_std: 0.06
      vy_std: 0.05
      wz_std: 0.25
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.1
      wz_max: 0.6
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer: {trajectory_step: 5, time_step: 3}
      AckermannConstraints: {min_turning_r: 0.2}
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.8}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
      CostCritic: {enabled: true, cost_power: 1, cost_weight: 3.81, near_collision_cost: 253, critical_cost: 300.0, consider_footprint: true,
        collision_cost: 1000000.0, near_goal_distance: 1.0, trajectory_point_step: 2}
      PathAlignCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, max_path_occupancy_ratio: 0.05, trajectory_point_step: 4,
        threshold_to_consider: 0.5, offset_from_furthest: 20, use_path_orientations: false}
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, offset_from_furthest: 5, threshold_to_consider: 1.4}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 2.0, offset_from_furthest: 4, threshold_to_consider: 0.5,
        max_angle_to_furthest: 1.0, mode: 0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[-0.273, -0.202], [0.0, -0.285], [0.273, -0.202], [0.273, 0.202], [0.0, 0.285], [-0.273, 0.202]]'
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 6.0,
          raytrace_min_range: 0.0, obstacle_max_range: 5.5, obstacle_min_range: 0.2}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, clearing: true, marking: true, data_type: LaserScan, raytrace_max_range: 6.0,
          raytrace_min_range: 0.0, obstacle_max_range: 5.5, obstacle_min_range: 0.2}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 4.0, inflation_radius: 0.55}
      always_send_full_costmap: true
      footprint: '[[-0.273, -0.202], [0.0, -0.285], [0.273, -0.202], [0.273, 0.202], [0.0, 0.285], [-0.273, 0.202]]'
map_saver:
  ros__parameters: {save_map_timeout: 5.0, free_thresh_default: 0.25, occupied_thresh_default: 0.65, map_subscribe_transient_local: true}
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased: {plugin: 'nav2_navfn_planner::NavfnPlanner', tolerance: 0.3, use_astar: false, allow_unknown: true}
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    assisted_teleop: {plugin: 'nav2_behaviors::AssistedTeleop'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: [AdjustSpeedLimit, ReroutingService, CollisionMonitor]
    ReroutingService: {plugin: 'nav2_route::ReroutingService'}
    AdjustSpeedLimit: {plugin: 'nav2_route::AdjustSpeedLimit'}
    CollisionMonitor: {plugin: 'nav2_route::CollisionMonitor', max_collision_dist: 3.0}
    edge_cost_functions: [DistanceScorer, CostmapScorer]
    DistanceScorer: {plugin: 'nav2_route::DistanceScorer'}
    CostmapScorer: {plugin: 'nav2_route::CostmapScorer'}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.1, 0.6]
    min_velocity: [-0.15, -0.1, -0.6]
    max_accel: [0.4, 0.3, 1.5]
    max_decel: [-0.4, -0.3, -1.5]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]      # no zeroing here: cmd_vel_min_speed_node lifts small commands instead
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_min
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint, time_before_collision: 2.0,
      simulation_time_step: 0.1, min_points: 6, visualize: false, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: scan, min_height: -0.2, max_height: 0.5, enabled: true}
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock: {plugin: 'opennav_docking::SimpleChargingDock', docking_threshold: 0.05, staging_x_offset: -0.7,
      use_external_detection_pose: true, use_battery_status: false, use_stall_detection: false, external_detection_timeout: 1.0,
      external_detection_translation_x: -0.18, external_detection_translation_y: 0.0, external_detection_rotation_roll: -1.57,
      external_detection_rotation_pitch: -1.57, external_detection_rotation_yaw: 0.0, filter_coef: 0.1}
    controller: {k_phi: 3.0, k_delta: 2.0, v_linear_min: 0.05, v_linear_max: 0.1, use_collision_detection: true, costmap_topic: local_costmap/costmap_raw,
      footprint_topic: local_costmap/published_footprint, transform_tolerance: 0.1, projection_time: 5.0, simulation_step: 0.1,
      dock_collision_threshold: 0.3}
